<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Эквалайзер">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<title>Эквалайзер</title>
<meta name="description" content="Полноэкранный эквалайзер для музыки. Слушает микрофон, звук не покидает браузер.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0612'/%3E%3Cpath fill='%23ff2f5e' d='M6 18h4v8H6z'/%3E%3Cpath fill='%23ffb02e' d='M14 7h4v19h-4z'/%3E%3Cpath fill='%234cc9ff' d='M22 13h4v13h-4z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500&family=Unbounded:wght@500&display=swap">
<style>
  /* Экран целиком отдан картинке; интерфейс появляется только на старте и на мгновение при смене вида. */
  :root {
    color-scheme: dark;
    --ground: #0a0612;
    --ink: #f7f1ea;
    --ink-soft: #b9afc2;
    --ember: #ff7a2e;
    --display: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Golos Text", -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ground); color: var(--ink); overflow: hidden; font: 16px/1.5 var(--body); }
  /* На телефоне жесты управляют сценой: страница не прокручивается, не масштабируется и не выделяет текст */
  html, body { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body.no-cursor, body.no-cursor * { cursor: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #veil { position: fixed; inset: 0; background: var(--ground); opacity: 0; pointer-events: none; }

  #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 24px;
    padding-block: max(40px, 9vh) 40px;
    padding-left: max(24px, 7vw, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    background: linear-gradient(100deg, rgba(10, 6, 18, .9), rgba(10, 6, 18, .72) 42%, rgba(10, 6, 18, 0) 74%);
  }
  h1 { margin: 0; font: 500 clamp(32px, 6.4vw, 92px)/1.05 var(--display); letter-spacing: -.03em; }
  #lede { margin: 0; max-width: 34em; font-size: clamp(16px, 1.5vw, 20px); color: var(--ink-soft); }
  #lede strong { color: var(--ink); font-weight: 500; }
  #start {
    align-self: flex-start; padding: 16px 28px; border: 0; border-radius: 999px;
    background: var(--ink); color: var(--ground); font: 500 18px/1.2 var(--body); cursor: pointer;
    transition: transform .16s cubic-bezier(.2, .8, .2, 1), background-color .16s;
  }
  #start:hover { background: #fff; }
  #start:active { transform: scale(.97); }
  #start:disabled { opacity: .6; cursor: progress; }
  #start:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }

  .hud {
    position: fixed; left: max(24px, env(safe-area-inset-left, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px));
    max-width: calc(100vw - 48px); padding: 8px 14px; border-radius: 10px; background: rgba(10, 6, 18, .62);
    color: var(--ink); font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  .hud.on { opacity: 1; transition-duration: .12s; }
  #name { bottom: auto; top: max(20px, env(safe-area-inset-top, 0px)); font: 500 15px/1.4 var(--display); }
  kbd { font: inherit; color: #ffc48f; }

  @media (prefers-reduced-motion: reduce) { .hud, #start { transition: none; } }
</style>
</head>
<body>
<canvas id="c2d" aria-hidden="true"></canvas>
<canvas id="cgl" aria-hidden="true" hidden></canvas>
<canvas id="cfl" aria-hidden="true" hidden></canvas>
<canvas id="c3d" aria-hidden="true" hidden></canvas>
<canvas id="c3m" aria-hidden="true" hidden></canvas>
<div id="veil"></div>

<section id="gate">
  <h1 id="head">Эквалайзер</h1>
  <p id="lede">Включите музыку рядом и разрешите доступ к микрофону. Звук никуда не отправляется и не записывается: всё считается прямо в браузере.</p>
  <button id="start" type="button" autofocus>Включить микрофон</button>
</section>

<div id="name" class="hud" role="status"></div>
<div id="hint" class="hud"><kbd>Клик</kbd> или <kbd>→</kbd> следующий вид · <kbd>←</kbd> предыдущий · <kbd>1</kbd>–<kbd>9</kbd>, <kbd>0</kbd> выбор · <kbd>↑</kbd> <kbd>↓</kbd> вариация · <kbd>+</kbd> <kbd>−</kbd> чувствительность · <kbd>F</kbd> весь экран</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const rnd = (a, b) => a + Math.random() * (b - a);
const follow = (dt, tau) => 1 - Math.exp(-dt / tau);          // сглаживание, не зависящее от частоты кадров
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches ? .35 : 1; // меньше вспышек по запросу системы

/* ───────────── Звук ───────────── */
// Чувствительность 1–9: каждый шаг сдвигает порог на 4 dB, 5 — середина
const SENS = {
  level: (() => { try { return clamp(parseInt(localStorage.getItem("eq-sens"), 10) || 5, 1, 9); } catch { return 5; } })(),
  db() { return (this.level - 5) * 4; },
  set(l) { this.level = clamp(l, 1, 9); try { localStorage.setItem("eq-sens", String(this.level)); } catch {} },
};
const BANDS = 96, FMIN = 50, FMAX = 16000;
const A = { v: new Float32Array(BANDS), act: 0, bass: 0, mid: 0, high: 0, energy: 0, beat: 0, beats: 0, sinceBeat: 9 };
let mic = null;

function openAnalyser(ctx, stream) {
  const an = ctx.createAnalyser();
  an.fftSize = 4096;
  an.smoothingTimeConstant = 0;   // сглаживаем сами, с разной скоростью подъёма и спада
  const src = ctx.createMediaStreamSource(stream);
  src.connect(an);                // в колонки не выводим, иначе будет завывание
  const hzPerBin = ctx.sampleRate / an.fftSize, top = Math.min(FMAX, ctx.sampleRate * .45);
  const edges = Array.from({ length: BANDS + 1 }, (_, i) => FMIN * Math.pow(top / FMIN, i / BANDS) / hzPerBin);
  const hz = i => FMIN * Math.pow(top / FMIN, (i + .5) / BANDS);
  const group = (lo, hi) => { const g = []; for (let i = 0; i < BANDS; i++) if (hz(i) >= lo && hz(i) <= hi) g.push(i); return g; };
  return {
    ctx, src, an, stream, edges,
    fd: new Float32Array(an.frequencyBinCount), td: new Float32Array(an.fftSize),
    db: new Float32Array(BANDS), bandRef: new Float32Array(BANDS).fill(-45), ref: -45,
    rms: -80, buckets: [], bucketMin: 0, bucketAge: 0, bass: 0,
    gBass: group(50, 160), gMid: group(300, 2500), gHigh: group(4000, 1e6),
  };
}

function readMic(m, dt) {
  m.an.getFloatFrequencyData(m.fd);
  m.an.getFloatTimeDomainData(m.td);

  // Громкость и подвижный порог шума. Минимум за 30 секунд считаем тишиной комнаты.
  let sum = 0;
  for (let i = 0; i < m.td.length; i++) sum += m.td[i] * m.td[i];
  const inst = 10 * Math.log10(sum / m.td.length + 1e-12);
  // Совсем нулевой сигнал (первые мгновения, выключенный микрофон) в порог не идёт, иначе он сбил бы его на полминуты
  const hasSignal = inst > -100;
  if (hasSignal) {
    if (m.bucketAge === 0) { m.rms = inst; m.bucketMin = inst; }
    m.rms += (inst - m.rms) * follow(dt, .1);
    m.bucketMin = Math.min(m.bucketMin, m.rms);
    m.bucketAge += dt;
    if (m.bucketAge >= 1) {
      m.buckets.push(m.bucketMin);
      if (m.buckets.length > 30) m.buckets.shift();
      m.bucketMin = m.rms; m.bucketAge = .001;
    }
  }
  const floor = Math.min(-50, m.bucketMin, ...m.buckets);   // громче -50 dB шум комнаты считать не будем
  const act = hasSignal ? clamp((m.rms - floor - 4) / 6) : 0;
  A.act += (act - A.act) * follow(dt, act > A.act ? .1 : 1.2);

  // Спектр по логарифмическим полосам
  let peak = -160;
  for (let b = 0; b < BANDS; b++) {
    const lo = m.edges[b], hi = m.edges[b + 1];
    let db;
    if (hi - lo < 1.5) {
      const c = (lo + hi) / 2, i = Math.floor(c), f = c - i;
      // В полной тишине браузер отдаёт -Infinity, поэтому значения ограничены снизу
      db = Math.max(m.fd[i], -160) * (1 - f) + Math.max(m.fd[i + 1], -160) * f;
    } else {
      let p = 0, n = 0;
      for (let i = Math.ceil(lo); i <= hi && i < m.fd.length; i++) { p += Math.pow(10, Math.max(m.fd[i], -160) / 10); n++; }
      db = 10 * Math.log10(p / Math.max(n, 1) + 1e-16);
    }
    m.db[b] = db;
    if (db > peak) peak = db;
  }

  // Автоподстройка: общая под громкость и своя для каждой полосы.
  // Микрофон ноутбука слабо слышит бас, поэтому полосы выравниваем относительно их же максимума.
  // Подстройка медленная в обе стороны: сильный удар выстреливает, а не приглушает всё вокруг
  m.ref += (peak - m.ref) * follow(dt, peak > m.ref ? 2.5 : 6);
  const RANGE = 36, FIXED = -30, sens = SENS.db();
  for (let b = 0; b < BANDS; b++) {
    const db = m.db[b];
    m.bandRef[b] += (db - m.bandRef[b]) * follow(dt, db > m.bandRef[b] ? 1.5 : 6);
    const tilt = (Math.max(m.bandRef[b], m.ref - 48) - m.ref) * .85;   // верха в музыке слабее баса на десятки dB
    // Половина отклика подстраивается под музыку, половина зависит от настоящей громкости: громче звук — сильнее картинка
    const nAuto = clamp((db - (m.ref + tilt - sens - RANGE)) / RANGE);
    const nAbs = clamp((db - (FIXED + tilt - sens - RANGE)) / RANGE);
    const n = nAuto * .5 + nAbs * .5;
    const target = Math.pow(n, 1.6) * .97 * A.act;
    A.v[b] += (target - A.v[b]) * follow(dt, target > A.v[b] ? .02 : .16);
  }

  mixDown(m.gBass, m.gMid, m.gHigh, dt);
  const b = A.bass;
  m.bass += (b - m.bass) * follow(dt, .8);
  if (b > m.bass + .1 && b > .22 && A.sinceBeat > .18) fireBeat();
}

const mean = g => { let s = 0; for (let i = 0; i < g.length; i++) s += A.v[g[i]]; return g.length ? s / g.length : 0; };
function mixDown(gB, gM, gH, dt) {
  const env = (cur, x) => cur + (x - cur) * follow(dt, x > cur ? .03 : .22);
  A.bass = env(A.bass, mean(gB)); A.mid = env(A.mid, mean(gM)); A.high = env(A.high, mean(gH));
  let s = 0; for (let i = 0; i < BANDS; i++) s += A.v[i];
  A.energy = env(A.energy, s / BANDS);
}
function fireBeat() { A.beat = 1; A.beats++; A.sinceBeat = 0; }

// Заставка до включения микрофона: показывает, что будет на экране.
const dB = Array.from({ length: BANDS }, (_, i) => i).filter(i => i < 16);
const dM = Array.from({ length: BANDS }, (_, i) => i).filter(i => i >= 30 && i < 64);
const dH = Array.from({ length: BANDS }, (_, i) => i).filter(i => i >= 72);
let demoBeat = 0;
function readDemo(dt, t) {
  A.act += (1 - A.act) * follow(dt, .3);
  demoBeat += dt;
  if (demoBeat > .56) { demoBeat = 0; fireBeat(); }
  const kick = Math.exp(-demoBeat * 7);
  for (let i = 0; i < BANDS; i++) {
    const x = i / BANDS;
    const body = .34 + .2 * Math.sin(x * 11 + t * 1.15) + .14 * Math.sin(x * 29 - t * 2.1) + .08 * Math.sin(x * 61 + t * 3.7);
    const target = clamp(body * (1 - x * .45) + kick * .62 * Math.exp(-x * 9));
    A.v[i] += (target - A.v[i]) * follow(dt, .07);
  }
  mixDown(dB, dM, dH, dt);
}

const sample = x => {     // значение спектра в точке 0..1
  const p = clamp(x) * (BANDS - 1), i = Math.floor(p), f = p - i;
  return A.v[i] * (1 - f) + (A.v[Math.min(i + 1, BANDS - 1)]) * f;
};

/* ───────────── Холсты ───────────── */
const c2d = $("c2d"), cgl = $("cgl"), main = c2d.getContext("2d", { alpha: false });
const mk = () => { const c = document.createElement("canvas"); return { c, x: c.getContext("2d") }; };
const layer = mk(), glowA = mk(), glowB = mk();
let W = 0, H = 0, dpr = 1;

function resize() {
  const cw = innerWidth, ch = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2, Math.sqrt(5e6 / Math.max(cw * ch, 1)));
  W = Math.max(1, Math.round(cw * dpr)); H = Math.max(1, Math.round(ch * dpr));
  c2d.width = layer.c.width = W; c2d.height = layer.c.height = H;
  glowA.c.width = Math.ceil(W / 6); glowA.c.height = Math.ceil(H / 6);
  glowB.c.width = Math.ceil(W / 20); glowB.c.height = Math.ceil(H / 20);
  bars.grad = null;
}

// Свечение: тот же кадр, уменьшенный и растянутый поверх в режиме сложения.
function present(strength) {
  main.globalCompositeOperation = "source-over"; main.globalAlpha = 1;
  main.drawImage(layer.c, 0, 0);
  for (const g of [glowA, glowB]) { g.x.imageSmoothingEnabled = true; g.x.imageSmoothingQuality = "high"; }
  glowA.x.clearRect(0, 0, glowA.c.width, glowA.c.height);
  glowA.x.drawImage(layer.c, 0, 0, glowA.c.width, glowA.c.height);
  glowB.x.clearRect(0, 0, glowB.c.width, glowB.c.height);
  glowB.x.drawImage(glowA.c, 0, 0, glowB.c.width, glowB.c.height);
  main.globalCompositeOperation = "lighter";
  main.imageSmoothingEnabled = true; main.imageSmoothingQuality = "high";
  main.globalAlpha = .55 * strength; main.drawImage(glowA.c, 0, 0, W, H);
  main.globalAlpha = .8 * strength; main.drawImage(glowB.c, 0, 0, W, H);
  main.globalAlpha = 1; main.globalCompositeOperation = "source-over";
}

/* ───────────── Вид 1: столбцы ───────────── */
const bars = {
  title: "Столбцы",
  canvas: c2d,
  grad: null, peaks: new Float32Array(BANDS), hold: new Float32Array(BANDS), fall: new Float32Array(BANDS),
  enter() { this.peaks.fill(0); },
  draw(dt, t) {
    const n = clamp(Math.round(innerWidth / 15), 28, BANDS);
    const margin = W * .035, step = (W - margin * 2) / n, bw = step * .7;
    const hz = H * .75, maxH = H * .67, x = layer.x;

    const bg = main.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#0a0612"); bg.addColorStop(.75, "#160a22"); bg.addColorStop(1, "#080510");
    main.fillStyle = bg; main.fillRect(0, 0, W, H);
    const pulse = (.05 + A.bass * .3 + A.beat * .12 * calm) * A.act;   // пол подсвечивается от баса
    const glow = main.createRadialGradient(W / 2, hz, 0, W / 2, hz, W * .62);
    glow.addColorStop(0, `rgba(255,70,90,${pulse})`); glow.addColorStop(.5, `rgba(150,40,130,${pulse * .4})`); glow.addColorStop(1, "rgba(60,20,90,0)");
    main.fillStyle = glow; main.fillRect(0, 0, W, H);

    if (!this.grad) {
      this.grad = x.createLinearGradient(margin, 0, W - margin, 0);
      [[0, "#ff2f5e"], [.26, "#ff7a2e"], [.5, "#ffd23f"], [.74, "#6ef0c8"], [1, "#4cc9ff"]].forEach(s => this.grad.addColorStop(s[0], s[1]));
    }
    const path = new Path2D(), caps = new Path2D(), capH = Math.max(2, 3 * dpr), lift = 3 * dpr;
    for (let i = 0; i < n; i++) {
      const u = (i + .5) / n;
      const rest = (1 - A.act) * (.012 + .012 * Math.sin(u * 9 + t * .6));   // в тишине остаётся лёгкая волна
      const v = clamp(sample(u) + rest);
      const px = margin + i * step + (step - bw) / 2, h = Math.max(capH, v * maxH);
      path.rect(px, -h, bw, h);
      // Пик держится мгновение и падает с ускорением
      if (v >= this.peaks[i]) { this.peaks[i] = v; this.hold[i] = .28; this.fall[i] = 0; }
      else if ((this.hold[i] -= dt) <= 0) { this.fall[i] += dt * 4; this.peaks[i] = Math.max(0, this.peaks[i] - this.fall[i] * dt); }
      if (this.peaks[i] > .03) caps.rect(px, -this.peaks[i] * maxH - lift - capH, bw, capH);
    }

    x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalCompositeOperation = "source-over"; x.globalAlpha = 1;
    x.clearRect(0, 0, W, H);
    x.fillStyle = this.grad;
    x.translate(0, hz); x.fill(path); x.setTransform(1, 0, 0, 1, 0, 0);

    // К основанию столбцы темнеют, яркий верх читается издалека
    const shade = x.createLinearGradient(0, hz - maxH, 0, hz);
    shade.addColorStop(0, "rgba(22,10,34,0)"); shade.addColorStop(1, "rgba(22,10,34,.62)");
    x.globalCompositeOperation = "source-atop"; x.fillStyle = shade; x.fillRect(0, 0, W, hz);

    // Отражение на полу
    x.globalCompositeOperation = "source-over"; x.globalAlpha = .34; x.fillStyle = this.grad;
    x.setTransform(1, 0, 0, -.36, 0, hz + 4 * dpr); x.fill(path); x.setTransform(1, 0, 0, 1, 0, 0);
    x.globalAlpha = 1;
    const fade = x.createLinearGradient(0, hz, 0, hz + maxH * .36);
    fade.addColorStop(0, "rgba(0,0,0,.1)"); fade.addColorStop(1, "rgba(0,0,0,1)");
    x.globalCompositeOperation = "destination-out"; x.fillStyle = fade; x.fillRect(0, hz, W, H - hz);

    x.globalCompositeOperation = "source-over"; x.fillStyle = "#fff6e6";
    x.translate(0, hz); x.fill(caps); x.setTransform(1, 0, 0, 1, 0, 0);

    present(.75);
  },
};

/* ───────────── Вид 2: круговой спектр ───────────── */
const SPOKES = 96;   // на каждую половину круга
const ringColors = Array.from({ length: SPOKES }, (_, i) => {
  const u = i / (SPOKES - 1), s = [[255, 106, 213], [138, 125, 255], [124, 245, 255]];
  const p = u * 2, k = Math.min(Math.floor(p), 1), f = p - k;
  return s[k].map((c, j) => Math.round(c + (s[k + 1][j] - c) * f));
}).map(c => `rgb(${c})`);

const ring = {
  title: "Круг",
  canvas: c2d,
  variants: ["неон", "чёрная дыра"], variant: 0,
  rot: 0, parts: [], seen: 0, spin: 0, stars: null, falling: [],
  enter() { layer.x.setTransform(1, 0, 0, 1, 0, 0); layer.x.clearRect(0, 0, W, H); this.parts.length = 0; this.falling.length = 0; this.seen = A.beats; },
  onVariant() { this.enter(); },

  // Вариация «чёрная дыра»: чёрный фон, только белые линии
  drawHole(dt, t) {
    const S = Math.min(W, H), cx = W / 2, cy = H / 2, x = layer.x, act = A.act;
    if (!this.stars) this.stars = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(.4, 1.3), a: rnd(.15, .7), p: rnd(0, 7) }));
    // На громких местах удары раздувают горизонт и кольца сильнее
    const loud = clamp((A.energy - .38) / .3) * act;
    this.boost = (this.boost || 0) + (loud - (this.boost || 0)) * follow(dt, loud > (this.boost || 0) ? .2 : 1.1);
    this.kick = (this.kick || 0) * Math.exp(-dt / .2);
    if (A.beats !== this.seenKick) { this.seenKick = A.beats; this.kick = Math.max(this.kick, (.35 + A.bass * .65) * act * calm); }
    const pulse = this.kick * (.05 + .17 * this.boost);
    const R = S * .125 * (1 + A.bass * .07 * act + pulse);       // горизонт событий
    const tilt = .19 + .025 * Math.sin(t * .17);
    this.spin += dt * (.12 + 1.5 * A.energy * act);

    main.fillStyle = "#000"; main.fillRect(0, 0, W, H);
    main.fillStyle = "#fff";
    for (const st of this.stars) {
      main.globalAlpha = st.a * (.75 + .25 * Math.sin(t * 1.3 + st.p));
      main.fillRect(st.x * W, st.y * H, st.r * dpr, st.r * dpr);
    }
    main.globalAlpha = 1;

    x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = "source-over"; x.globalAlpha = 1;
    x.clearRect(0, 0, W, H);
    x.strokeStyle = "#fff"; x.lineCap = "round"; x.lineJoin = "round";

    // Аккреционный диск: орбиты, внутренние на басу, внешние на верхах; внутренние крутятся быстрее
    const RINGS = 14;
    const disk = front => {
      for (let i = 0; i < RINGS; i++) {
        const u = i / (RINGS - 1), r = R * (1.6 + u * 2.05), level = sample(.06 + u * .86) * act;
        x.globalAlpha = .18 + (1 - u) * .22 + level * .6;
        x.lineWidth = Math.max(1, (1.4 - u * .6) * dpr);
        const dash = S * (.006 + u * .02);
        x.setLineDash([dash * (1.5 + level * 2), dash]);
        x.lineDashOffset = -this.spin * S * .25 / Math.pow(.35 + u, 1.5);
        x.beginPath();
        for (let k = 0; k <= 90; k++) {
          const a = (front ? 0 : Math.PI) + k / 90 * Math.PI;
          const rr = r * (1 + pulse * .6 + level * (.07 + this.boost * .08) * Math.sin(a * (3 + i % 4) + this.spin * (2 + i * .3)));
          const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * tilt;
          k ? x.lineTo(px, py) : x.moveTo(px, py);
        }
        x.stroke();
      }
      x.setLineDash([]);
    };
    disk(false);                                                // задняя половина, за горизонтом

    // Дальняя сторона диска, изогнутая гравитацией над дырой
    for (let j = 0; j < 5; j++) {
      const r = R * (1.2 + j * .16), level = sample(.08 + j * .12) * act;
      x.lineWidth = Math.max(1, (1.3 - j * .15) * dpr);
      x.globalAlpha = .55 - j * .08 + level * .4;
      x.beginPath(); x.ellipse(cx, cy, r * 1.06, r * (.92 + level * .08), 0, Math.PI, Math.PI * 2); x.stroke();
      x.globalAlpha = .16 - j * .02;
      x.beginPath(); x.ellipse(cx, cy, r * 1.02, r * .7, 0, 0, Math.PI); x.stroke();
    }

    x.globalAlpha = 1; x.fillStyle = "#000";
    x.beginPath(); x.arc(cx, cy, R, 0, 7); x.fill();
    x.lineWidth = Math.max(1.5, 2.2 * dpr);
    x.globalAlpha = clamp(.8 + A.beat * .5 * calm + this.kick * this.boost);
    x.beginPath(); x.arc(cx, cy, R, 0, 7); x.stroke();

    // Фотонные кольца: контуры спектра вокруг горизонта, бас внизу, верха наверху
    for (let j = 0; j < 3; j++) {
      const base = R * (1.05 + j * .05), amp = S * (.06 - j * .016) * (1 + this.boost * .7);
      x.lineWidth = Math.max(1, (1.6 - j * .4) * dpr);
      x.globalAlpha = .85 - j * .25;
      x.beginPath();
      for (let k = 0; k <= 180; k++) {
        const a = k / 180 * Math.PI * 2;
        let d = Math.abs(((a - Math.PI / 2) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
        const v = Math.pow(sample(d / Math.PI), 1 + j * .5) * act;
        const rr = base + amp * v + (1 - act) * R * .012 * Math.sin(a * 5 + t * .6);
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        k ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.stroke();
    }

    disk(true);                                                 // передняя половина проходит перед дырой

    // На сильной доле вещество падает в дыру по спирали
    if (A.beats !== this.seen) {
      this.seen = A.beats;
      const n = Math.round((4 + A.bass * 12) * act);
      for (let i = 0; i < n && this.falling.length < 160; i++) this.falling.push({ r: R * rnd(3.4, 4.1), a: rnd(0, 7), px: null, py: null });
    }
    x.lineWidth = Math.max(1, 1.4 * dpr);
    for (let i = this.falling.length - 1; i >= 0; i--) {
      const p = this.falling[i];
      p.a += dt * 1.7 * Math.pow(R / p.r, 1.5) * 2.6 * (1 + A.energy * 1.5);
      p.r -= dt * p.r * (.22 + A.energy * .5);
      if (p.r < R * 1.05) { this.falling.splice(i, 1); continue; }
      const px = cx + Math.cos(p.a) * p.r, py = cy + Math.sin(p.a) * p.r * tilt;
      const hidden = Math.sin(p.a) < 0 && Math.hypot(px - cx, py - cy) < R * 1.02;
      if (p.px !== null && !hidden) {
        x.globalAlpha = clamp(.95 - p.r / (R * 5));
        x.beginPath(); x.moveTo(p.px, p.py); x.lineTo(px, py); x.stroke();
      }
      p.px = px; p.py = py;
    }
    x.globalAlpha = 1;
    present(.75);
  },

  draw(dt, t) {
    if (this.variant === 1) return this.drawHole(dt, t);
    const S = Math.min(W, H), cx = W / 2, cy = H / 2, x = layer.x;
    const R = S * .19 * (1 + A.bass * .13 * A.act), maxLen = S * .25;
    this.rot += dt * (.03 + .2 * A.energy);

    const bg = main.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(W, H) * .55);
    bg.addColorStop(0, "#141640"); bg.addColorStop(.55, "#090b20"); bg.addColorStop(1, "#04050f");
    main.fillStyle = bg; main.fillRect(0, 0, W, H);

    // Шлейф: предыдущий кадр не стирается, а тает
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1;
    x.globalCompositeOperation = "destination-out";
    x.fillStyle = `rgba(0,0,0,${follow(dt, .075)})`; x.fillRect(0, 0, W, H);
    x.globalCompositeOperation = "lighter";

    x.translate(cx, cy); x.rotate(this.rot);
    const core = x.createRadialGradient(0, 0, 0, 0, 0, R * .92);
    const coreA = .05 + (A.bass * .34 + A.beat * .14 * calm) * A.act;
    core.addColorStop(0, `rgba(255,140,220,${coreA})`); core.addColorStop(.7, `rgba(120,100,255,${coreA * .55})`); core.addColorStop(1, "rgba(120,100,255,0)");
    x.fillStyle = core; x.beginPath(); x.arc(0, 0, R * .92, 0, 7); x.fill();

    x.lineCap = "round";
    x.lineWidth = Math.max(1.5, 2 * Math.PI * R / (SPOKES * 2) * .5);
    for (let i = 0; i < SPOKES; i++) {
      const u = (i + .5) / SPOKES;
      const breath = (1 - A.act) * (.018 + .012 * Math.sin(u * 8 + t * .5));
      const v = clamp(sample(u) + breath), len = Math.max(1, v * maxLen);
      for (const side of [1, -1]) {          // бас внизу, верха сходятся наверху
        const a = Math.PI / 2 + side * u * Math.PI, ca = Math.cos(a), sa = Math.sin(a);
        x.strokeStyle = ringColors[i];
        x.globalAlpha = .95;
        x.beginPath(); x.moveTo(ca * R, sa * R); x.lineTo(ca * (R + len), sa * (R + len)); x.stroke();
        x.globalAlpha = .32;
        const inner = R - 4 * dpr;
        x.beginPath(); x.moveTo(ca * inner, sa * inner); x.lineTo(ca * (inner - len * .22), sa * (inner - len * .22)); x.stroke();
      }
    }
    x.setTransform(1, 0, 0, 1, 0, 0);

    // На сильной доле с кольца срываются искры
    if (A.beats !== this.seen) {
      this.seen = A.beats;
      const count = Math.min(26, 8 + Math.round(A.bass * 22));
      for (let i = 0; i < count && this.parts.length < 240; i++) {
        const a = Math.random() * Math.PI * 2, sp = S * (.1 + Math.random() * .24 + A.bass * .18);
        this.parts.push({ x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, c: ringColors[Math.floor(Math.random() * SPOKES)] });
      }
    }
    for (let i = this.parts.length - 1; i >= 0; i--) {
      const p = this.parts[i];
      p.life -= dt / 1.25;
      if (p.life <= 0) { this.parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= Math.exp(-dt * .9); p.vy *= Math.exp(-dt * .9);
      x.globalAlpha = p.life * .9; x.fillStyle = p.c;
      x.beginPath(); x.arc(p.x, p.y, (1 + p.life) * dpr, 0, 7); x.fill();
    }
    x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
    present(.9);
  },
};

/* ───────────── Вид 3: свет (шейдер) ───────────── */
const FRAG = `precision highp float;
uniform vec2 u_res; uniform float u_t, u_bass, u_mid, u_high, u_beat, u_ring, u_act; uniform vec3 u_c1, u_c2, u_c3;
const mat2 ROT = mat2(.8, .6, -.6, .8);
float hash(vec2 p){ p = fract(p * vec2(127.1, 311.7)); p += dot(p, p + 34.23); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p){
  float a = .5, s = 0.;
  for (int i = 0; i < 5; i++) { s += a * noise(p); p = ROT * p * 2.03 + 17.; a *= .5; }
  return s;
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5 * u_res) / min(u_res.x, u_res.y);
  float d = length(p);
  p *= 1. - .1 * u_bass * exp(-d * 1.6);
  vec2 s = p * 1.55;
  vec2 q = vec2(fbm(s + u_t * .9), fbm(s + vec2(5.2, 1.3) - u_t * .7));
  float warp = 2.1 + u_bass * 2.;
  vec2 r = vec2(fbm(s + warp * q + vec2(1.7, 9.2) + u_t * .4), fbm(s + warp * q + vec2(8.3, 2.8) - u_t * .3));
  float f = fbm(s + (2.3 + u_mid) * r);

  vec3 c = vec3(.012, .022, .07);
  c = mix(c, u_c1, smoothstep(.14, .55, f));
  c = mix(c, u_c2, smoothstep(.38, .82, length(q) * f * 1.75));
  c = mix(c, u_c3, smoothstep(.5, .88, r.x * f * 2.05));

  float ridge = pow(1. - abs(2. * f - 1.), 7.);              // тонкие светящиеся нити оживают от верхов
  c += vec3(1., .78, .55) * ridge * (.03 + u_high * .5) * u_act;
  float shell = exp(-34. * (d - u_ring) * (d - u_ring)) * u_beat;  // волна от сильной доли
  c += vec3(.95, .42, .62) * shell * f * 1.3;

  float level = mix(.3, .5 + u_mid * .3 + u_bass * .5, u_act);
  c *= level;
  c *= 1. - .45 * smoothstep(.35, 1.15, d);
  c = c * (1. + c * .25) / (1. + c * .55);                    // мягкий потолок яркости
  c = pow(max(c, 0.), vec3(.95));
  c += (hash(gl_FragCoord.xy + u_t) - .5) / 255.;            // убирает полосы на плавных переходах
  gl_FragColor = vec4(c, 1.);
}`;

// Общая сцена для шейдерных видов: один контекст WebGL и несколько программ
const stage = {
  gl: null, views: [],
  init() {
    const gl = this.gl = this.gl || cgl.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" });
    if (!gl) return false;
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    return true;
  },
  program(frag) {
    const gl = this.gl;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const fs = sh(gl.FRAGMENT_SHADER, frag), pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}"));
    gl.attachShader(pr, fs);
    gl.bindAttribLocation(pr, 0, "a");
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getShaderInfoLog(fs)); return null; }
    return pr;
  },
};

// Палитры «Света»: глубина, основной цвет, самый горячий
const LIGHT_PALETTES = [
  [[.03, .27, .36], [.86, .10, .46], [1, .66, .18]],     // бирюза, малина, золото
  [[.02, .16, .50], [.04, .66, .78], [.82, .96, .78]],   // океан
  [[.24, .03, .50], [.96, .18, .26], [1, .74, .18]],     // закат
  [[.00, .28, .24], [.14, .78, .42], [.96, .90, .30]],   // лес
  [[.10, .08, .52], [.68, .16, .92], [1, .50, .68]],     // орхидея
];
function shaderView({ title, frag, scale, speed, palettes, paletteSpeed, before, prepare, extra }) {
  return {
    title, canvas: cgl, ok: false, scale, flow: 40, hue: 0, ring: 0, seen: 0, slow: 0, slowFor: 0, pr: null, u: null,
    init() {
      this.pr = stage.program(frag);
      if (!this.pr) return;
      this.u = {};
      for (const n of ["res", "t", "bass", "mid", "high", "beat", "ring", "act", "streak", "c1", "c2", "c3", "variant"]) this.u[n] = stage.gl.getUniformLocation(this.pr, "u_" + n);
      this.ok = true;
    },
    enter() { this.seen = A.beats; this.slow = 0; this.slowFor = 0; },
    draw(dt) {
      if (!this.ok) return;
      const gl = stage.gl;
      // Если машина не успевает, снижаем разрешение, а не плавность
      this.slow += (dt * 1000 - this.slow) * follow(dt, .5);
      this.slowFor = this.slow > 26 ? this.slowFor + dt : 0;
      if (this.slowFor > 1 && this.scale > .3) { this.scale *= .8; this.slowFor = 0; }
      const cw = Math.max(1, Math.round(innerWidth * this.scale)), ch = Math.max(1, Math.round(innerHeight * this.scale));
      if (cgl.width !== cw || cgl.height !== ch) { cgl.width = cw; cgl.height = ch; }
      gl.viewport(0, 0, cw, ch);
      gl.useProgram(this.pr);
      if (prepare) prepare(dt);

      const v = speed();
      this.flow += dt * v;
      if (A.beats !== this.seen) { this.seen = A.beats; this.ring = 0; }
      this.ring += dt * .75;
      const u = this.u;
      gl.uniform2f(u.res, cw, ch);
      gl.uniform1f(u.t, this.flow);
      gl.uniform1f(u.bass, A.bass * A.act); gl.uniform1f(u.mid, A.mid * A.act); gl.uniform1f(u.high, A.high * A.act);
      gl.uniform1f(u.beat, A.beat * A.act * calm); gl.uniform1f(u.ring, this.ring); gl.uniform1f(u.act, A.act);
      gl.uniform1f(u.streak, Math.min(v * 1.5, 2.6));
      if (before) before(gl);
      if (extra) for (const [name, value] of Object.entries(extra())) gl.uniform1f(this.u[name] || (this.u[name] = gl.getUniformLocation(this.pr, "u_" + name)), value);
      gl.uniform1f(u.variant, this.variant || 0);
      if (palettes) {   // палитры плавно перетекают одна в другую
        this.hue = (this.hue + dt * paletteSpeed()) % palettes.length;
        const i = Math.floor(this.hue), k = this.hue - i, e = k * k * (3 - 2 * k), A0 = palettes[i], B0 = palettes[(i + 1) % palettes.length];
        [u.c1, u.c2, u.c3].forEach((loc, n) => gl.uniform3f(loc, ...A0[n].map((x, j) => x + (B0[n][j] - x) * e)));
      }
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };
}

const light = shaderView({ title: "Свет", frag: FRAG, scale: .7, speed: () => .012 + A.act * (.045 + .17 * A.energy),   // в тишине почти замирает
  palettes: LIGHT_PALETTES, paletteSpeed: () => .012 + A.act * (.07 + .26 * A.energy) });   // под музыку новая палитра примерно каждые 5 секунд

/* ───────────── Вид 4: космос ───────────── */
const SPACE = `precision highp float;
uniform vec2 u_res; uniform float u_t, u_bass, u_mid, u_high, u_beat, u_ring, u_act, u_streak, u_flash;
const mat2 ROT = mat2(.8, .6, -.6, .8);
float hash(vec2 p){ p = fract(p * vec2(127.1, 311.7)); p += dot(p, p + 34.23); return fract(p.x * p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p){
  float a = .5, s = 0.;
  for (int i = 0; i < 4; i++) { s += a * noise(p); p = ROT * p * 2.03 + 17.; a *= .5; }
  return s;
}
void main(){
  vec2 p = (gl_FragCoord.xy - .5 * u_res) / min(u_res.x, u_res.y);
  float d = length(p);

  // Фон почти чёрный, туманности едва проступают только на музыке
  float drift = u_t * .05;
  vec2 n = p * 1.35;
  float w = fbm(n + drift);
  float cloudA = fbm(n + 2.2 * w + vec2(3.1, -drift));
  float cloudB = fbm(n * 1.6 + 1.7 * w + vec2(7.4, drift * .7));
  vec3 c = vec3(.001, .001, .004);
  c += vec3(.36, .12, .68) * smoothstep(.55, .85, cloudA) * (.008 + u_mid * .15);
  c += vec3(.90, .30, .10) * smoothstep(.6, .88, cloudB) * u_bass * .12;

  // Звёзды: случайные точки в нескольких слоях глубины, каждый слой летит на зрителя
  vec2 dir = p / (d + .001);
  for (int i = 0; i < 6; i++) {
    float fi = float(i), z = fi / 6. + u_t * .3, depth = fract(z), seed = floor(z) + fi * 17.;
    float sc = 24. * exp(-depth * 2.2);
    vec2 g = p * sc + vec2(seed * 13.71, seed * 7.13);
    vec2 id = floor(g), f = fract(g);
    float h = hash(id + seed), h2 = hash(id + seed + 41.7);
    if (h > .62) {
      vec2 q = f - vec2(.25 + .5 * h2, .25 + .5 * fract(h2 * 7.3));
      q = vec2(dot(q, dir) / (1. + u_streak * 5.5 * depth * depth), dot(q, vec2(-dir.y, dir.x)));   // далёкая звезда точка, вытягивается по мере приближения
      float r = .018 + .022 * fract(h2 * 3.7);
      float star = smoothstep(r, r * .3, length(q));
      float fade = smoothstep(0., .3, depth) * smoothstep(1., .84, depth);
      vec3 tint = mix(vec3(.74, .85, 1.), vec3(1., .88, .72), step(.82, h));
      c += tint * star * fade * (.75 + .6 * sin(u_t * 30. + h * 40.) * u_high + u_high * .9);
    }
  }
  c += vec3(.42, .6, 1.) * exp(-52. * (d - u_ring) * (d - u_ring)) * u_beat * .12;  // еле заметная волна от удара
  c += vec3(.9, .94, 1.) * u_flash * (.05 + .03 * (1. - d));                          // белая вспышка на прыжке, едва заметная
  c = c * (1. + c * .2) / (1. + c * .42);
  c += (hash(gl_FragCoord.xy + u_t) - .5) / 255.;
  gl_FragColor = vec4(c, 1.);
}`;
// Прыжок: на громких местах полёт резко ускоряется, на мощном ударе еле заметная белая вспышка
const jump = { boost: 0, flash: 0, seen: 0 };
const space = shaderView({
  title: "Космос", frag: SPACE, scale: 1,
  prepare(dt) {
    const loud = clamp((A.energy - .4) / .3) * A.act;
    jump.boost += (loud - jump.boost) * follow(dt, loud > jump.boost ? .25 : 1.4);
    if (A.beats !== jump.seen) {
      jump.seen = A.beats;
      if (A.bass > .55 && jump.boost > .35) jump.flash = Math.max(jump.flash, .6 + A.bass * .4);
    }
    jump.flash *= Math.exp(-dt / .22);
  },
  speed: () => clamp((A.act - .05) / .95) * (.1 + 1.05 * A.energy + A.beat * .35 * calm) + jump.boost * jump.boost * 2.4 * calm,   // без звука полёт стоит
  extra: () => ({ flash: jump.flash * calm }),
});

/* ───────────── Вид 7: огонь ───────────── */
const FIRE = `precision highp float;
uniform vec2 u_res; uniform float u_t, u_beat, u_high, u_act, u_variant, u_boost; uniform sampler2D u_spec;
const mat2 ROT = mat2(.8, .6, -.6, .8);

  blit(t) {
    const gl = this.gl;
    gl.bindFramebuffer(gl.FRAMEBUFFER, t ? t.fb : null);
    t ? gl.viewport(0, 0, t.w, t.h) : gl.viewport(0, 0, this.canvas.width, this.canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },
  splat(field, at, add, rad, burst = 0) {
    this.use("splat", { at, add, rad, burst, aspect: this.aspect }, { s: field.r.tex });
    this.blit(field.w); field.swap();
  },
  pour(at, pigment, amount, rad, burst, force) {
    if (burst) this.splat(this.vel, at, [0, 0, 0, 0], rad * 1.4, burst);
    if (force) this.splat(this.vel, at, [force[0], force[1], 0, 0], rad);
    this.splat(this.dye, at, [pigment[0] * amount, pigment[1] * amount, pigment[2] * amount, 0], rad);
  },
  seed() {
    this.seeded = true;
    for (let i = 0; i < 9; i++) this.pour([rnd(.08, .92), rnd(.1, .9)], PIGMENTS[i % PIGMENTS.length], rnd(.6, 1.1), rnd(.012, .03));
  },
  inject(h, t) {
    if (A.beats !== this.seen) {          // на ударе вливается новый цвет и расталкивает старые
      this.seen = A.beats; this.turn++;
      const at = [rnd(.14, .86), rnd(.16, .84)], bass = A.bass * A.act;
      if (this.turn % 5 === 0) this.pour(at, [-2, -2, -2], 1, .016, 60 + bass * 90);   // белила освежают холст
      else this.pour(at, PIGMENTS[this.turn % PIGMENTS.length], .55 + bass * .85, rnd(.003, .007) * (1 + bass), (60 + bass * 130) * calm);
      if (bass > .28) {                   // на басах по холсту разлетаются капли и пятна
        const drops = 1 + Math.round(bass * 4);
        for (let i = 0; i < drops; i++) {
          const r = rnd(.0008, .0032) * (.6 + bass);
          this.pour([rnd(.06, .94), rnd(.08, .92)], PIGMENTS[Math.floor(Math.random() * PIGMENTS.length)], .9 + bass, r, 18 * calm);
        }
      }
    }
    // Пока звук сильный, на холст падают мелкие капли: чем громче, тем чаще
    const loud = clamp((A.energy - .38) / .3) * A.act;
    this.dropAcc = (this.dropAcc || 0) + this.realDt * loud * 7;   // по реальному времени, а не по шагу симуляции
    while (this.dropAcc >= 1) {
      this.dropAcc--; this.drops = (this.drops || 0) + 1;
      this.pour([rnd(.04, .96), rnd(.06, .94)], PIGMENTS[Math.floor(Math.random() * PIGMENTS.length)], 1.3, rnd(.0003, .0011), 8 * calm);
    }
    // Три кисти: на басах, середине и верхах
    this.phase += h * (.1 + A.energy * .9);
    const brushes = [[A.bass, .0016, 1.0, 0], [A.mid, .0011, 1.37, 2.1], [A.high, .0007, 1.83, 4.2]];
    brushes.forEach(([lv, rad, wob, off], i) => {
      const level = lv * A.act;
      if (level < .1) return;
      const a = this.phase * wob + off;
      const at = [.5 + .38 * Math.sin(a), .5 + .36 * Math.sin(a * 1.31 + off)];
      const push = 900 * level * h;   // сила на секунду, а не на кадр: иначе жидкость разгоняется без предела
      const force = [Math.cos(a) * push, Math.cos(a * 1.31 + off) * push];
      this.pour(at, PIGMENTS[((this.turn >> 2) + i * 2) % PIGMENTS.length], level * h * 2, rad, 0, force);
    });
    // В тишине поверхность едва шевелится
    if (A.act < .5) this.splat(this.vel, [.5 + .3 * Math.sin(t * .17), .5 + .3 * Math.cos(t * .13)], [Math.cos(t * .3) * 3, Math.sin(t * .23) * 3, 0, 0], .05);
  },
  enter() { this.seen = A.beats; this.slow = 0; this.slowFor = 0; },
  draw(dt, t) {
    if (!this.ok) return;
    const gl = this.gl, c = this.canvas;
    const cw = Math.round(innerWidth * Math.min(dpr, 1.5)), ch = Math.round(innerHeight * Math.min(dpr, 1.5));
    if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
    // Смена пропорций (например, вход в полный экран) и нехватка мощности
    this.slow += (dt * 1000 - this.slow) * follow(dt, .5);
    this.slowFor = this.slow > 28 ? this.slowFor + dt : 0;
    const tooSlow = this.slowFor > 1 && this.dyeH > 300;
    if (tooSlow) { this.dyeH = Math.round(this.dyeH * .75); this.simH = Math.max(96, Math.round(this.simH * .85)); this.slowFor = 0; }
    if (tooSlow || Math.abs(innerWidth / Math.max(innerHeight, 1) - this.aspect) > .01) this.allocate();
    if (!this.seeded) this.seed();

    const h = clamp(dt, .008, .025);
    this.realDt = dt;
    // Сила звука задаёт скорость течения: громко значит бурно, в тишине краска быстро замирает
    const drive = clamp(A.act * A.energy * 1.8), flow = .15 + drive * 1.6;
    this.inject(h, t);

    this.use("curl", {}, { u: this.vel.r.tex }); this.blit(this.crl);
    this.use("vort", { amt: 3 + drive * 20, dt: h }, { u: this.vel.r.tex, c: this.crl.tex }); this.blit(this.vel.w); this.vel.swap();
    this.use("div", {}, { u: this.vel.r.tex }); this.blit(this.dvg);
    this.use("fade", { keep: .8 }, { s: this.prs.r.tex }); this.blit(this.prs.w); this.prs.swap();
    for (let i = 0; i < 18; i++) { this.use("jacobi", {}, { p: this.prs.r.tex, d: this.dvg.tex }); this.blit(this.prs.w); this.prs.swap(); }
    this.use("grad", {}, { p: this.prs.r.tex, u: this.vel.r.tex }); this.blit(this.vel.w); this.vel.swap();
    this.use("advect", { dt: h * flow, keep: Math.exp(-h * (.35 + (1 - drive) * 3)) }, { u: this.vel.r.tex, s: this.vel.r.tex }); this.blit(this.vel.w); this.vel.swap();
    // Краска бледнеет только пока играет музыка, поэтому в тишине картина остаётся на холсте
    this.use("advect", { dt: h * flow, keep: Math.exp(-h * A.act / (this.dark ? 3.2 : 7)) }, { u: this.vel.r.tex, s: this.dye.r.tex }); this.blit(this.dye.w); this.dye.swap();

    const save = this.tx; this.tx = [1 / this.dyeW, 1 / this.dyeH];
    this.use("show", { dark: this.dark ? 1 : 0 }, { s: this.dye.r.tex }); this.blit(null);
    this.tx = save;
  },
};
paint.canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); paint.ok = false; });
paint.canvas.addEventListener("webglcontextrestored", () => paint.init());

/* ───────────── Вид 11: киборг (3D, отдельный модуль) ───────────── */
const cyborg = {
  title: "Киборг",
  canvas: $("c3d"),
  impl: null, loading: false, failed: false,
  async load() {
    this.loading = true;
    flash($("name"), "Киборг загружается…", 8000);
    try {
      const mod = await import("./skull.js");
      this.impl = await mod.createSkull(this.canvas, A, calm, k => flash($("name"), `Киборг загружается… ${Math.round(k * 100)}%`, 8000));
      this.impl.setVariant(this.variant);
      if (views[cur] === this) flash($("name"), "Киборг", 1400);
    } catch (e) {
      console.error(e);
      this.failed = true;
      flash($("name"), "Не получилось загрузить сцену «Киборг». Проверьте интернет и обновите страницу.", 5000);
    }
    this.loading = false;
  },
  variants: ["цветной", "ЧБ, красные лазеры"], variant: 0,
  onVariant() { if (this.impl) this.impl.setVariant(this.variant); },
  enter() { if (!this.impl && !this.loading && !this.failed) this.load(); },
  draw(dt, t) { if (this.impl) this.impl.draw(dt, t); },
};

/* ───────────── Вид 12: маска (2.5D, отдельный модуль) ───────────── */
const mask = {
  title: "Маска",
  canvas: $("c3m"),
  impl: null, loading: false, failed: false,
  async load() {
    this.loading = true;
    flash($("name"), "Маска загружается…", 8000);
    try {
      const mod = await import("./face.js");
      this.impl = await mod.createFace(this.canvas, A, calm, k => flash($("name"), `Маска загружается… ${Math.round(k * 100)}%`, 8000));
      this.impl.setVariant(this.variant);
      if (views[cur] === this) flash($("name"), "Маска", 1400);
    } catch (e) {
      console.error(e);
      this.failed = true;
      flash($("name"), "Не получилось загрузить сцену «Маска». Проверьте интернет и обновите страницу.", 5000);
    }
    this.loading = false;
  },
  variants: ["голубые глаза", "красные глаза"], variant: 0,
  onVariant() { if (this.impl) this.impl.setVariant(this.variant); },
  enter() { if (!this.impl && !this.loading && !this.failed) this.load(); },
  draw(dt, t) { if (this.impl) this.impl.draw(dt, t); },
};

/* ───────────── Смена видов ───────────── */
if (stage.init()) shaderViews.forEach(v => v.init());
paint.init();
const views = [bars, ring, light, space, bacteria, paint, fire, dopamine, rider, iron, cyborg, mask].filter(v => v.ok !== false);
const remember = {
  get() { try { return parseInt(localStorage.getItem("eq-view"), 10) || 0; } catch { return 0; } },
  set(i) { try { localStorage.setItem("eq-view", String(i)); } catch {} },
};
let cur = clamp(remember.get(), 0, views.length - 1);

// Вариации: у вида может быть несколько вариантов сцены, они листаются стрелками вверх и вниз
const variantStore = {
  read() { try { return JSON.parse(localStorage.getItem("eq-variants")) || {}; } catch { return {}; } },
  write(map) { try { localStorage.setItem("eq-variants", JSON.stringify(map)); } catch {} },
};
{
  const saved = variantStore.read();
  for (const v of views) if (v.variants) v.variant = clamp(saved[v.title] ?? v.variant ?? 0, 0, v.variants.length - 1);
}
const labelOf = v => v.variants && v.variants.length > 1 ? `${v.title} · ${v.variants[v.variant]}` : v.title;
function shiftSens(step) {
  SENS.set(SENS.level + step);
  flash($("name"), `Чувствительность ${"▮".repeat(SENS.level)}${"▯".repeat(9 - SENS.level)} ${SENS.level} из 9`, 1800);
}
function shiftVariant(step) {
  const v = views[cur], n = v.variants ? v.variants.length : 1;
  if (n < 2) { flash($("name"), `${v.title}: пока одна вариация`, 1600); return; }
  v.variant = (v.variant + step + n) % n;
  const map = variantStore.read(); map[v.title] = v.variant; variantStore.write(map);
  if (v.onVariant) v.onVariant();
  flash($("name"), `${labelOf(v)} (${v.variant + 1} из ${n})`, 1800);
}
let started = false;

function show(i, announce) {
  cur = (i + views.length) % views.length;
  remember.set(cur);
  const v = views[cur];
  for (const c of [c2d, cgl, paint.canvas, cyborg.canvas, mask.canvas]) c.hidden = v.canvas !== c;
  v.enter();
  if (announce) {
    $("veil").animate([{ opacity: 1 }, { opacity: 0 }], { duration: calm < 1 ? 1 : 320, easing: "ease-out" });
    flash($("name"), labelOf(v), 1600);
  }
}

const timers = new Map();
function flash(el, text, ms) {
  if (text != null) el.textContent = text;
  el.classList.add("on");
  clearTimeout(timers.get(el));
  timers.set(el, setTimeout(() => el.classList.remove("on"), ms));
}

/* ───────────── Запуск ───────────── */
let wantFullscreen = false;
const canFull = !!document.documentElement.requestFullscreen && document.fullscreenEnabled !== false;   // на iPhone такой возможности нет
const isFull = () => !!document.fullscreenElement;
async function goFull() {
  if (!canFull) return false;
  try { await document.documentElement.requestFullscreen({ navigationUI: "hide" }); wantFullscreen = false; return true; }
  catch { return false; }
}
function toggleFull() {
  wantFullscreen = false;
  if (isFull()) document.exitFullscreen().catch(() => {}); else goFull();
}

const FAIL = {
  NotAllowedError: ["Микрофон запрещён", "Нажмите на значок слева от адреса сайта, разрешите микрофон и обновите страницу. Если там уже разрешено, откройте на Mac: Системные настройки → Конфиденциальность и безопасность → Микрофон и включите браузер."],
  NotFoundError: ["Микрофон не найден", "Подключите микрофон или проверьте, что он выбран в настройках звука, и попробуйте снова."],
  NotReadableError: ["Микрофон занят", "Его использует другая программа или система его не отдаёт. Закройте её и попробуйте снова."],
  lost: ["Микрофон отключился", "Проверьте подключение и включите его снова."],
  insecure: ["Браузер не даёт доступ к микрофону", "Откройте страницу по адресу, который начинается с https://."],
  other: ["Не получилось включить микрофон", "Обновите страницу и попробуйте снова. Лучше всего работает Chrome."],
};
function fail(kind) {
  const [head, text] = FAIL[kind] || FAIL.other;
  started = false; mic = null;
  $("head").textContent = head;
  $("lede").textContent = text;
  $("start").textContent = "Попробовать снова";
  $("start").disabled = false;
  $("gate").hidden = false;
  document.body.classList.remove("no-cursor");
  if (isFull()) document.exitFullscreen().catch(() => {});
}

let wake = null;
async function keepAwake() {
  try { if (navigator.wakeLock && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (started) keepAwake();
  if (mic && mic.ctx.state !== "running") mic.ctx.resume().catch(() => {});
});

$("start").addEventListener("click", async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail("insecure");
  $("start").disabled = true;

  // Если доступ уже дан, окна с вопросом не будет и полный экран можно включить сразу.
  // Иначе ждём ответа: браузер закрыл бы полный экран ради вопроса о микрофоне.
  let granted = false;
  try { granted = (await navigator.permissions.query({ name: "microphone" })).state === "granted"; } catch {}
  let full = granted ? goFull() : null;

  let ctx = null;
  try { ctx = new AudioContext({ latencyHint: "interactive" }); ctx.resume().catch(() => {}); } catch { return fail("other"); }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
    });
  } catch (e) {
    ctx.close().catch(() => {});
    return fail(e && e.name in FAIL ? e.name : "other");
  }
  await ctx.resume().catch(() => {});
  mic = openAnalyser(ctx, stream);
  stream.getAudioTracks().forEach(tr => tr.addEventListener("ended", () => fail("lost")));

  $("gate").hidden = true;
  started = true;
  keepAwake();
  if (!full) full = goFull();
  if (!(await full) && canFull) wantFullscreen = true;   // пока длился вопрос, браузер забыл про клик
  if (wantFullscreen) flash($("hint"), "Кликните в любом месте, чтобы открыть на весь экран", 6000);
  else flash($("hint"), null, 5000);
  armCursor();
});

/* ───────────── Управление ───────────── */
let cursorTimer = 0;
function armCursor() {
  document.body.classList.remove("no-cursor");
  clearTimeout(cursorTimer);
  if (started) cursorTimer = setTimeout(() => document.body.classList.add("no-cursor"), 2000);
}
if (matchMedia("(pointer: coarse)").matches) {       // на телефоне подсказка про жесты
  $("hint").innerHTML = "<kbd>Касание</kbd> или <kbd>свайп ←</kbd> следующий вид · <kbd>свайп →</kbd> предыдущий · <kbd>свайп ↑ ↓</kbd> вариация · <kbd>двумя пальцами ↑ ↓</kbd> чувствительность";
}
const HINT_HTML = $("hint").innerHTML;
addEventListener("mousemove", () => {
  armCursor();
  if (started && !wantFullscreen) { $("hint").innerHTML = HINT_HTML; flash($("hint"), null, 2000); }
});
// Касание переключает вид, свайп влево и вправо листает виды, вверх и вниз вариации
let press = null, fingers = new Map(), twoFinger = false;
addEventListener("pointerdown", e => {
  if (!started || e.target.closest("#gate")) return;
  fingers.set(e.pointerId, e.clientY);
  if (fingers.size >= 2) { twoFinger = true; press = null; return; }   // два пальца меняют чувствительность
  press = { x: e.clientX, y: e.clientY, id: e.pointerId };
});
addEventListener("pointercancel", e => { press = null; fingers.delete(e.pointerId); if (!fingers.size) twoFinger = false; });
addEventListener("pointerup", e => {
  const y0 = fingers.get(e.pointerId);
  fingers.delete(e.pointerId);
  if (twoFinger) {
    if (y0 !== undefined && Math.abs(e.clientY - y0) > 40 && fingers.size === 1) shiftSens(e.clientY < y0 ? 1 : -1);
    if (!fingers.size) twoFinger = false;
    return;
  }
  if (!press || e.pointerId !== press.id) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y;
  press = null;
  const swipe = Math.max(Math.abs(dx), Math.abs(dy)) > 40;
  if (!swipe && wantFullscreen) { goFull(); $("hint").classList.remove("on"); return; }
  if (!swipe) show(cur + 1, true);
  else if (Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1), true);
  else shiftVariant(dy < 0 ? 1 : -1);
});
addEventListener("keydown", e => {
  if (!started || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
  const k = e.key;
  if (k === "ArrowRight") show(cur + 1, true);
  else if (k === "ArrowLeft") show(cur - 1, true);
  else if (/^[1-9]$/.test(k) && +k <= views.length) show(+k - 1, true);
  else if (k === "0" && views.length >= 10) show(9, true);
  else if (e.code === "KeyF") toggleFull();
  else if (k === "+" || k === "=") shiftSens(1);
  else if (k === "-" || k === "_" || k === "−") shiftSens(-1);
  else if (k === "ArrowUp") shiftVariant(1);
  else if (k === "ArrowDown") shiftVariant(-1);
  else return;
  e.preventDefault();
});
addEventListener("resize", resize);

/* ───────────── Кадр ───────────── */
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(.1, Math.max(.001, (now - last) / 1000));
  last = now; T += dt;
  A.sinceBeat += dt;
  A.beat *= Math.exp(-dt / .18);
  if (mic) readMic(mic, dt); else readDemo(dt, T);
  views[cur].draw(dt, T);
  requestAnimationFrame(frame);
}
resize();
show(cur, false);
requestAnimationFrame(frame);
</script>
</body>
